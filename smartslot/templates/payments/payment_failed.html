{% extends 'base.html' %}

{% block content %}
<div style="max-width:480px; margin:0 auto; text-align:center; padding:4rem 0;">

    <div style="font-size:3rem; color:var(--error); margin-bottom:1rem;">
        <i class="fa-solid fa-circle-xmark"></i>
    </div>
    <h2 style="font-size:1.4rem; font-weight:700; color:var(--text); margin-bottom:0.5rem;">Payment Failed</h2>
    <p style="color:var(--muted); font-size:0.95rem; margin-bottom:2rem;">
        Your payment was not completed. Your booking has not been confirmed.
    </p>

    <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
        <a href="/resources/" class="btn btn-primary">
            <i class="fa-solid fa-arrow-left"></i> Back to Resources
        </a>
        <a href="/bookings/" class="btn btn-ghost">My Bookings</a>
    </div>
</div>
{% endblock %}

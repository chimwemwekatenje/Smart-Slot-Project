<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSlot Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg: #0F172A; --surface: #1E2937; --border: #334155;
            --primary: #14B8A6; --primary-dark: #0F766E;
            --text: #E2E8F0; --muted: #94A3B8; --muted-dim: #64748B;
            --error: #EF4444; --r: 12px; --r-sm: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-wrap { width: 100%; max-width: 420px; padding: 1.5rem; }

        /* Logo */
        .brand { text-align: center; margin-bottom: 2.5rem; }
        .brand-logo {
            width: 56px; height: 56px; background: var(--primary);
            border-radius: 14px; display: inline-flex; align-items: center;
            justify-content: center; font-size: 1.6rem; color: #fff;
            margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(20,184,166,0.3);
        }
        .brand-name { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .brand-sub  { color: var(--muted-dim); font-size: 0.9rem; margin-top: 4px; }

        /* Card */
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r); padding: 2rem;
        }
        .card-title { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .card-sub   { color: var(--muted-dim); font-size: 0.875rem; margin-bottom: 1.75rem; }

        /* Form */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.1rem; }
        .form-label { font-size: 0.83rem; font-weight: 600; color: var(--muted); }
        .form-input {
            width: 100%; padding: 11px 14px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--r-sm); color: var(--text);
            font-size: 0.92rem; outline: none; font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s; color-scheme: dark;
        }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(20,184,166,0.12); }
        .input-wrap { position: relative; }
        .input-wrap .form-input { padding-right: 44px; }
        .toggle-pwd {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--muted-dim);
            cursor: pointer; font-size: 0.95rem;
        }

        /* Error */
        .alert-error {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5; padding: 12px 16px; border-radius: var(--r-sm);
            font-size: 0.875rem; display: flex; align-items: center; gap: 10px;
            margin-bottom: 1.25rem;
        }

        /* Button */
        .btn-submit {
            width: 100%; padding: 13px; background: var(--primary); color: #fff;
            border: none; border-radius: var(--r-sm); font-size: 1rem; font-weight: 700;
            cursor: pointer; font-family: inherit; display: flex; align-items: center;
            justify-content: center; gap: 8px; margin-top: 0.5rem;
            transition: background 0.15s, transform 0.12s;
        }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .back-link {
            display: block; text-align: center; margin-top: 1.25rem;
            color: var(--muted-dim); font-size: 0.875rem; text-decoration: none;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
<div class="login-wrap">

    <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-gauge-high"></i></div>
        <div class="brand-name">SmartSlot</div>
        <div class="brand-sub">Admin Portal</div>
    </div>

    <div class="card">
        <div class="card-title">Admin Sign In</div>
        <div class="card-sub">Access the management dashboard</div>

        {% if error %}
        <div class="alert-error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}

            <div class="form-group">
                <label class="form-label"><i class="fa-regular fa-user" style="margin-right:5px;"></i>Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter username" autofocus />
            </div>

            <div class="form-group" style="margin-bottom:1.5rem;">
                <label class="form-label"><i class="fa-solid fa-lock" style="margin-right:5px;"></i>Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" id="pwd" class="form-input" placeholder="Enter password" />
                    <button type="button" class="toggle-pwd" onclick="togglePwd()">
                        <i class="fa-regular fa-eye" id="pwd-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
            </button>
        </form>
    </div>

    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left" style="margin-right:5px;"></i>Back to SmartSlot</a>

</div>
<script>
function togglePwd() {
    const i = document.getElementById('pwd');
    const ic = document.getElementById('pwd-icon');
    i.type = i.type === 'password' ? 'text' : 'password';
    ic.className = i.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
}
</script>
</body>
</html>

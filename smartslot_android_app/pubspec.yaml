name: smartslot_android_app
description: Smart Slot booking application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & API / Supabase
  http: ^1.2.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  
  # State Management
  provider: ^6.1.2
  
  # UI Components
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  video_player: ^2.8.1
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1
  
  # Email (optional - configure credentials)
  emailjs: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/boardroom.jpg
    - assets/images/cars.jpg
    - assets/images/office-workers.webp
    - assets/images/people_boardroom.jpg
